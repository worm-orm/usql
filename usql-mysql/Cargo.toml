[package]
name = "usql-mysql"
version = "0.1.0"
edition = "2024"

[features]
rustls = ["mysql_async/rustls-tls", "mysql_async/ring", "mysql_async/tls12"]

[dependencies]
usql-core = { path = "../usql-core" }
usql-value = { path = "../usql-value", features = ["serde"] }

mysql_async = { version = "0.37", default-features = false, features = [
    "minimal-rust",
] }

async-lock = { workspace = true }
async-stream = { version = "0.3" }

chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
futures = { version = "0.3" }
tokio = { version = "1", features = ["rt", "macros"] }
usql = { path = "../usql" }
usql-any = { path = "../usql-any", features = ["mysql"] }
usql-migrate = { path = "../usql-migrate", features = ["sql"] }
